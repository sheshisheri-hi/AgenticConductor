# Conductor — local development services
#
# Usage:
#   docker compose up -d postgres          — start PostgreSQL only
#   docker compose up -d postgres pgadmin  — start PostgreSQL + pgAdmin UI
#   docker compose up -d                   — start everything
#
# After starting postgres, set in .env:
#   CONDUCTOR_DB_URL=postgresql+asyncpg://conductor:conductor_dev@localhost:5435/conductor
#
# pgAdmin UI:  http://localhost:5050  (admin@conductor.dev / admin)
# Connect pgAdmin to: host=postgres, port=5432, user=conductor, db=conductor

services:
  postgres:
    image: postgres:16-alpine
    container_name: conductor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: conductor
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor_dev    # change in production
    ports:
      - "5435:5432"
    volumes:
      - conductor_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor -d conductor"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: conductor_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@conductor.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - conductor_pgadmin_data:/var/lib/pgadmin

volumes:
  conductor_pg_data:
  conductor_pgadmin_data:
