[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conductor-integrations"
version = "0.1.0"
description = "Pre-built integrations for Conductor: Snyk, Sonar, BlackDuck, ADO, Git, Notify"
requires-python = ">=3.11"
dependencies = [
    "conductor-core",
    "pydantic>=2.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
copilot = [
    "github-copilot-sdk",   # real LLM via Copilot subscription (sample/live mode)
]
live = [
    "httpx>=0.27",          # async HTTP client for Snyk, Sonar, BlackDuck APIs
    "pyyaml>=6.0",          # optional repo registry YAML
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "github-copilot-sdk",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["conductor_integrations*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
