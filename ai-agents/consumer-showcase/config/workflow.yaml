workflow:
  name: security_remediation
  description: "Full security pipeline: Triage → Security → Resolve → Plan → Code → Review → Document → Deliver"
  mode: plan

# ── filter rules (evaluated before any agent runs) ───────────────────────────
filters:
  - type: reject_if_in
    field: work_item.severity
    values: [info]
  - type: reject_if_null
    field: work_item.repo_name

# ── routing rules (select which workflow handles the item) ───────────────────
routes:
  - match:
      source: [snyk, sonar, blackduck, ado, mock]
    graph: security_remediation
  - match:
      source: ["*"]
    graph: escalate_human

# ── stage definitions ────────────────────────────────────────────────────────
stages:
  - name: triage
    agent: triage
    on_proceed: security_analysis
    on_block: terminal

  - name: security_analysis
    agent: security_analyst
    on_proceed: resolve
    on_block: terminal

  - name: resolve
    agent: resolver
    on_proceed: plan
    on_block: terminal

  - name: plan
    agent: planner
    on_proceed: code
    on_block: terminal

  - name: code
    agent: code
    stop_before: true
    on_proceed: review_gate
    on_block: terminal

  - name: review_gate
    on_proceed: document
    on_block: terminal

  - name: document
    agent: scribe
    on_proceed: deliver
    on_block: terminal

  - name: deliver
    agent: git
    on_proceed: notify_feedback
    on_block: terminal

  - name: notify_feedback
    on_proceed: terminal
    on_block: terminal

# ── parallel groups ──────────────────────────────────────────────────────────
parallel_groups:
  - trigger_stage: review_gate
    agents: [security_gatekeeper, reviewer]
    merge_strategy: all_must_pass
    next_stage_on_pass: document
    next_stage_on_block: terminal

  - trigger_stage: notify_feedback
    agents: [notify, feedback]
    merge_strategy: first_pass
    next_stage_on_pass: terminal
    next_stage_on_block: terminal

